# Plataforma IoT - Integração de Dados II (Entrega 1 - Fundação)
#
# O ambiente é dividido em dois perfis para caber num PC com 8 GB de RAM:
#   - ingestao: simulador -> Kafka -> consumidor -> RustFS (Bronze), Cassandra e Redis
#   - catalogo: MongoDB e Neo4j com o catálogo da fábrica
# Suba um perfil de cada vez. Veja o README para os comandos.

name: plataforma-iot

x-app-env: &app-env
  KAFKA_BOOTSTRAP: kafka:9092
  TOPICO_LEITURAS: sensores.leituras
  S3_ENDPOINT: http://rustfs:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin123}
  BUCKET_BRONZE: bronze
  CASSANDRA_HOST: cassandra
  CASSANDRA_KEYSPACE: iot
  REDIS_HOST: redis
  MONGO_URI: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-admin123}@mongo:27017/?authSource=admin
  MONGO_DB: fabrica
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-senha12345}
  TZ: America/Sao_Paulo

x-app: &app
  build: ./app
  image: plataforma-iot-app:latest
  environment: *app-env

services:
  # ---------------------------------------------------------------- ingestao
  rustfs:
    image: rustfs/rustfs:latest
    profiles: ["ingestao"]
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # console web
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin123}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: warn
    volumes:
      - rustfs-data:/data
    mem_limit: 384m
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.1
    profiles: ["ingestao"]
    ports:
      - "29092:29092"   # acesso a partir do Windows (opcional)
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xmx384m -Xms384m
    mem_limit: 900m
    healthcheck:
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx64m /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 20s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  cassandra:
    image: cassandra:4.1
    profiles: ["ingestao"]
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: iot-cluster
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
      JVM_EXTRA_OPTS: -Dcassandra.skip_wait_for_gossip_to_settle=0 -Dcassandra.num_tokens=1 -Dcassandra.initial_token=0
    volumes:
      - cassandra-data:/var/lib/cassandra
    mem_limit: 1200m
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' > /dev/null 2>&1"]
      interval: 20s
      timeout: 20s
      retries: 15
      start_period: 60s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    profiles: ["ingestao"]
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "6379:6379"
    mem_limit: 128m
    restart: unless-stopped

  kafka-console:
    image: docker.redpanda.com/redpandadata/console:latest
    profiles: ["ingestao"]
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    mem_limit: 192m
    restart: unless-stopped

  # Cria buckets, tópico do Kafka e schema do Cassandra. Roda uma vez e termina.
  init:
    <<: *app
    profiles: ["ingestao"]
    command: ["python", "-m", "infra.init_infra"]
    depends_on:
      rustfs:
        condition: service_started
      kafka:
        condition: service_healthy
      cassandra:
        condition: service_healthy
    mem_limit: 192m
    restart: "no"

  simulador:
    <<: *app
    profiles: ["ingestao"]
    command: ["python", "-m", "simulador.simulador",
              "--intervalo", "${SIM_INTERVALO:-1.0}",
              "--prob-anomalia", "${SIM_PROB_ANOMALIA:-0.01}",
              "--seed", "${SIM_SEED:-42}"]
    depends_on:
      init:
        condition: service_completed_successfully
    mem_limit: 192m
    restart: unless-stopped

  consumidor:
    <<: *app
    profiles: ["ingestao"]
    command: ["python", "-m", "ingestao.consumidor_bronze"]
    environment:
      <<: *app-env
      LOTE_MAX_MENSAGENS: ${LOTE_MAX_MENSAGENS:-2000}
      LOTE_MAX_SEGUNDOS: ${LOTE_MAX_SEGUNDOS:-60}
    depends_on:
      init:
        condition: service_completed_successfully
    mem_limit: 256m
    restart: unless-stopped

  # ---------------------------------------------------------------- catalogo
  mongo:
    image: mongo:7.0
    profiles: ["catalogo"]
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin123}
    volumes:
      - mongo-data:/data/db
    mem_limit: 512m
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    profiles: ["catalogo"]
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # protocolo bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-senha12345}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
    volumes:
      - neo4j-data:/data
    mem_limit: 900m
    restart: unless-stopped

  mongo-express:
    image: mongo-express:1.0.2
    profiles: ["catalogo"]
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-admin123}@mongo:27017/?authSource=admin
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongo
    mem_limit: 128m
    restart: unless-stopped

  # Carrega fabrica.json no MongoDB e no Neo4j. Roda uma vez e termina.
  carga-catalogo:
    <<: *app
    profiles: ["catalogo"]
    command: ["sh", "-c", "python -m infra.carga_mongo && python -m infra.carga_neo4j"]
    depends_on:
      mongo:
        condition: service_started
      neo4j:
        condition: service_started
    mem_limit: 192m
    restart: "no"

  # ------------------------------------------------------- uso sob demanda
  # Para rodar consultas, verificações e testes:
  #   docker compose run --rm ferramentas python -m consultas.verificar_bronze
  ferramentas:
    <<: *app
    profiles: ["ferramentas"]
    command: ["python", "-c", "print('Use: docker compose run --rm ferramentas <comando>')"]
    mem_limit: 256m

volumes:
  rustfs-data:
  cassandra-data:
  mongo-data:
  neo4j-data:
